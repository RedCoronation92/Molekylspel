<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Molekylspel - Drag & Drop</title>
<style>
body{margin:0;overflow:hidden;background:#202020;font-family:Arial;color:white}
#ui{position:fixed;top:10px;left:10px;z-index:20;background:rgba(0,0,0,.85);padding:15px;border-radius:12px;width:280px}
button{width:100%;padding:12px;margin:5px 0;border:none;border-radius:8px;font-size:16px}
#trash{position:fixed;right:20px;bottom:20px;width:100px;height:100px;border-radius:18px;background:#b00000;display:flex;align-items:center;justify-content:center;font-size:48px;z-index:20}
</style>
</head>
<body>

<div id="ui">
<h2>Drag & Drop-test</h2>
<button onclick="addAtom('H')">Väte</button>
<button onclick="addAtom('O')">Syre</button>
<button onclick="addAtom('C')">Kol</button>
<p>Dra atomer med mus eller finger.</p>
</div>

<div id="trash">🗑️</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x202020);

const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.set(0,5,8);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

scene.add(new THREE.AmbientLight(0xffffff,1.5));
const light=new THREE.DirectionalLight(0xffffff,1.5);
light.position.set(5,10,5);
scene.add(light);

const grid=new THREE.GridHelper(20,20);
scene.add(grid);

const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
const dragPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);

let dragObject=null;
let atoms=[];

function atomColor(type){
return {H:0xffffff,O:0xff0000,C:0x333333}[type];
}

function addAtom(type){
const mesh=new THREE.Mesh(
new THREE.SphereGeometry(0.4,32,32),
new THREE.MeshStandardMaterial({color:atomColor(type)})
);
mesh.position.set((Math.random()-0.5)*4,0.4,(Math.random()-0.5)*4);
mesh.userData.type=type;
scene.add(mesh);
atoms.push(mesh);
}

window.addAtom=addAtom;

function pointer(event){
const e=event.touches ? event.touches[0] : event;
mouse.x=(e.clientX/window.innerWidth)*2-1;
mouse.y=-(e.clientY/window.innerHeight)*2+1;
return e;
}

function startDrag(event){

const e = event.touches ? event.touches[0] : event;

mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

raycaster.setFromCamera(mouse,camera);

const intersects = raycaster.intersectObjects(atoms,false);

if(intersects.length > 0){

    dragObject = intersects[0].object;

    console.log("Vald atom",dragObject);

    controls.enabled = false;
}
}

function moveDrag(event){
if(!dragObject) return;

pointer(event);
raycaster.setFromCamera(mouse,camera);

const pos=new THREE.Vector3();
raycaster.ray.intersectPlane(dragPlane,pos);

if(pos){
 dragObject.position.set(pos.x,0.4,pos.z);
}
}

function endDrag(event){
if(!dragObject){
 controls.enabled=true;
 return;
}

const e=event.changedTouches ? event.changedTouches[0] : event;
const trash=document.getElementById('trash').getBoundingClientRect();

if(
 e.clientX>trash.left &&
 e.clientX<trash.right &&
 e.clientY>trash.top &&
 e.clientY<trash.bottom
){
 scene.remove(dragObject);
 atoms=atoms.filter(a=>a!==dragObject);
}

 dragObject=null;
 controls.enabled=true;
}

renderer.domElement.addEventListener('mousedown',startDrag);
renderer.domElement.addEventListener('mousemove',moveDrag);
window.addEventListener('mouseup',endDrag);

renderer.domElement.addEventListener('touchstart',startDrag,{passive:true});
renderer.domElement.addEventListener('touchmove',moveDrag,{passive:true});
window.addEventListener('touchend',endDrag);

window.addEventListener('resize',()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});

function animate(){
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene,camera);
}

animate();
</script>
</body>
</html>
