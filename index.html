<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molekylspel</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111;
  color:white;
  overflow:hidden;
}
#ui{
  position:absolute;
  top:10px;
  left:10px;
  z-index:10;
  background:rgba(0,0,0,.85);
  padding:15px;
  border-radius:12px;
  width:min(320px,90vw);
}
button{
  width:100%;
  padding:12px;
  margin:5px 0;
  border:none;
  border-radius:8px;
}
#score{color:#00ff99;font-weight:bold}
</style>
</head>
<body>
<div id="ui">
  <h2>🧪 Bygg Molekylen</h2>
  <p>Formel: <strong id="formula"></strong></p>
  <p>Poäng: <span id="score">0</span></p>

  <button onclick="addAtom('H')">Väte (H)</button>
  <button onclick="addAtom('O')">Syre (O)</button>
  <button onclick="addAtom('C')">Kol (C)</button>

  <button onclick="checkSolution()">Kontrollera</button>
  <div id="message"></div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e1e1e);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,2,8);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 1.5));

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5,5,5);
scene.add(light);

const molecules = [
 {formula:'H₂O', atoms:{H:2,O:1}},
 {formula:'CO₂', atoms:{C:1,O:2}},
 {formula:'CH₄', atoms:{C:1,H:4}},
 {formula:'O₂', atoms:{O:2}}
];

let current;
let score = 0;
let atoms = [];

function colorOf(type){
 return {H:0xffffff,O:0xff0000,C:0x333333}[type];
}

function newTask(){
 atoms.forEach(a=>scene.remove(a.mesh));
 atoms=[];
 current = molecules[Math.floor(Math.random()*molecules.length)];
 document.getElementById('formula').textContent=current.formula;
 document.getElementById('message').textContent='';
}

window.addAtom = function(type){
 const mesh = new THREE.Mesh(
   new THREE.SphereGeometry(0.5,32,32),
   new THREE.MeshStandardMaterial({color:colorOf(type)})
 );

 mesh.position.set(
  (Math.random()-0.5)*4,
  (Math.random()-0.5)*4,
  (Math.random()-0.5)*4
 );

 scene.add(mesh);
 atoms.push({type,mesh});
};

window.checkSolution = function(){
 const count={};
 atoms.forEach(a=>count[a.type]=(count[a.type]||0)+1);

 let correct=true;

 for(const k in current.atoms){
   if(count[k]!==current.atoms[k]) correct=false;
 }

 if(Object.keys(count).length!==Object.keys(current.atoms).length){
   correct=false;
 }

 if(correct){
   score++;
   document.getElementById('score').textContent=score;
   document.getElementById('message').textContent='✅ Rätt molekyl!';
   setTimeout(newTask,1500);
 } else {
   document.getElementById('message').textContent='❌ Försök igen';
 }
};

function animate(){
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene,camera);
}

animate();
newTask();
</script>
</body>
</html>
