<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Molekylspel</title>
<style>
body{margin:0;overflow:hidden;font-family:Arial;background:#111;color:#fff}
#ui{position:fixed;left:10px;top:10px;z-index:10;background:rgba(0,0,0,.85);padding:15px;border-radius:12px;width:300px}
button{width:100%;padding:12px;margin:5px 0;border:none;border-radius:8px}
#trash{position:fixed;right:20px;bottom:20px;width:90px;height:90px;border-radius:16px;background:#b30000;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:bold;z-index:20}
#message{margin-top:10px}
</style>
</head>
<body>
<div id="ui">
<h2>🧪 Bygg Molekylen</h2>
<p>Formel: <strong id="formula"></strong></p>
<p>Poäng: <span id="score">0</span></p>
<button onclick="addAtom('H')">Väte (H)</button>
<button onclick="addAtom('O')">Syre (O)</button>
<button onclick="addAtom('C')">Kol (C)</button>
<button onclick="checkSolution()">Kontrollera</button>
<div id="message"></div>
</div>
<div id="trash">🗑️</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x222222);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1000);
camera.position.set(0,2,8);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,1.6));
const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,8,5);
scene.add(light);

const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

let dragging=null;
let atoms=[];
let score=0;

const molecules=[
{formula:'H₂O',atoms:{H:2,O:1}},
{formula:'CO₂',atoms:{C:1,O:2}},
{formula:'CH₄',atoms:{C:1,H:4}}
];

let current;

function newTask(){
atoms.forEach(a=>scene.remove(a.mesh));
atoms=[];
current=molecules[Math.floor(Math.random()*molecules.length)];
document.getElementById('formula').textContent=current.formula;
document.getElementById('message').textContent='';
}

function atomColor(t){
return {H:0xffffff,O:0xff0000,C:0x333333}[t];
}

function addAtom(type){
const mesh=new THREE.Mesh(
new THREE.SphereGeometry(0.5,32,32),
new THREE.MeshStandardMaterial({color:atomColor(type)})
);
mesh.position.set((Math.random()-.5)*4,0,(Math.random()-.5)*4);
scene.add(mesh);
atoms.push({type,mesh});
}

function pointerPosition(event){
const p=event.touches?event.touches[0]:event;
mouse.x=(p.clientX/innerWidth)*2-1;
mouse.y=-(p.clientY/innerHeight)*2+1;
}

function startDrag(event){
pointerPosition(event);
raycaster.setFromCamera(mouse,camera);
const hits=raycaster.intersectObjects(atoms.map(a=>a.mesh));
if(hits.length){
dragging=hits[0].object;
controls.enabled=false;
}
}

function moveDrag(event){
if(!dragging)return;
pointerPosition(event);
raycaster.setFromCamera(mouse,camera);
const plane=new THREE.Plane(new THREE.Vector3(0,0,1),0);
const point=new THREE.Vector3();
raycaster.ray.intersectPlane(plane,point);
dragging.position.copy(point);
}

function endDrag(event){
if(!dragging){controls.enabled=true;return;}
const p=event.changedTouches?event.changedTouches[0]:event;
const trash=document.getElementById('trash').getBoundingClientRect();
if(p.clientX>trash.left && p.clientX<trash.right && p.clientY>trash.top && p.clientY<trash.bottom){
scene.remove(dragging);
atoms=atoms.filter(a=>a.mesh!==dragging);
}
dragging=null;
controls.enabled=true;
}

function checkSolution(){
const count={};
atoms.forEach(a=>count[a.type]=(count[a.type]||0)+1);
let ok=true;
for(const k in current.atoms){
if(count[k]!==current.atoms[k]) ok=false;
}
if(Object.keys(count).length!==Object.keys(current.atoms).length) ok=false;
if(ok){
score++;
document.getElementById('score').textContent=score;
document.getElementById('message').textContent='✅ Rätt molekyl';
setTimeout(newTask,1500);
}else{
document.getElementById('message').textContent='❌ Fel molekyl';
}
}

window.addAtom=addAtom;
window.checkSolution=checkSolution;

renderer.domElement.addEventListener('mousedown',startDrag);
renderer.domElement.addEventListener('mousemove',moveDrag);
window.addEventListener('mouseup',endDrag);

renderer.domElement.addEventListener('touchstart',startDrag,{passive:false});
renderer.domElement.addEventListener('touchmove',moveDrag,{passive:false});
window.addEventListener('touchend',endDrag);

function animate(){
requestAnimationFrame(animate);
controls.update();
renderer.render(scene,camera);
}

animate();
newTask();
</script>
</body>
</html>
