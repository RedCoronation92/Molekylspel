<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molekylspel</title>
<style>
body{margin:0;background:#111;color:white;font-family:Arial;overflow:hidden}
#ui{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.85);padding:15px;border-radius:12px;z-index:10;width:300px}
button{width:100%;padding:12px;margin:5px 0;border:none;border-radius:8px}
#score{color:#00ff99;font-weight:bold}
</style>
</head>
<body>
<div id="ui">
<h2>🧪 Bygg Molekylen</h2>
<p>Formel: <strong id="formula"></strong></p>
<p>Poäng: <span id="score">0</span></p>
<button onclick="addAtom('H')">Väte (H)</button>
<button onclick="addAtom('O')">Syre (O)</button>
<button onclick="addAtom('C')">Kol (C)</button>
<button onclick="checkSolution()">Kontrollera</button>
<div id="message"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x222222);
const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.set(0,2,8);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,1.5));
const light=new THREE.DirectionalLight(0xffffff,1.5);
light.position.set(5,5,5);
scene.add(light);

const molecules=[
{formula:'H₂O',atoms:{H:2,O:1}},
{formula:'CO₂',atoms:{C:1,O:2}},
{formula:'CH₄',atoms:{C:1,H:4}}
];

let current;
let score=0;
let atoms=[];
function newTask(){
atoms.forEach(a=>scene.remove(a.mesh));
atoms=[];
current=molecules[Math.floor(Math.random()*molecules.length)];
document.getElementById('formula').textContent=current.formula;
document.getElementById('message').textContent='';
}

function addAtom(type){
const colors={H:0xffffff,O:0xff0000,C:0x333333};
const mesh=new THREE.Mesh(
new THREE.SphereGeometry(0.5,32,32),
new THREE.MeshStandardMaterial({color:colors[type]})
);
mesh.position.set((Math.random()-0.5)*4,(Math.random()-0.5)*4,(Math.random()-0.5)*4);
scene.add(mesh);
atoms.push({type,mesh});
}

function checkSolution(){
const count={};
atoms.forEach(a=>count[a.type]=(count[a.type]||0)+1);
let ok=true;
for(const k in current.atoms){
if(count[k]!==current.atoms[k]) ok=false;
}
if(Object.keys(count).length!==Object.keys(current.atoms).length) ok=false;
if(ok){
score++;
document.getElementById('score').textContent=score;
document.getElementById('message').textContent='✅ Rätt molekyl!';
setTimeout(newTask,1500);
}else{
document.getElementById('message').textContent='❌ Försök igen';
}
}
function animate(){
requestAnimationFrame(animate);
controls.update();
renderer.render(scene,camera);
}

animate();
newTask();


window.addEventListener('resize',()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
